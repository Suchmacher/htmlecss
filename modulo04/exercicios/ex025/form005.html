<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas" value="M"><label for="isxmas"> Masculino <br></label>
            <input type="radio" name="sexo" id="isxfem" checked value="F"><label for="isxfem"> Feminino</label>            
        </fieldset>
        <fieldset>
            <Legend>Esportes Favoritos</Legend>
            <input type="checkbox" name="esbas" id="iesba"><label for="iesba"> Basquete</label> <br>
            <input type="checkbox" name="esfut" id="iesfut"><label for="iesfut"> Futebol</label> <br>
            <input type="checkbox" name="esna" id="iesna"><label for="iesna"> Natação</label> <br>
            <input type="checkbox" name="esten" id="iesten"><label for="iesten"> Tênis</label>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
